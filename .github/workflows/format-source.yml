name: One-time source formatting

on:
  push:
    branches:
      - chatgpt/implementation-v1
    paths:
      - ".github/workflows/format-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/implementation-v1
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and format source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore Taskronome.sln --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed: $LASTEXITCODE" }
          dotnet format Taskronome.sln --no-restore --severity warn
          if ($LASTEXITCODE -ne 0) { throw "dotnet format failed: $LASTEXITCODE" }

      - name: Commit formatted source
        shell: pwsh
        run: |
          git config user.name "Taskronome formatter"
          git config user.email "actions@users.noreply.github.com"
          git add src tests
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes were required."
            exit 0
          }
          git commit -m "style: apply dotnet formatting"
          git push origin HEAD:chatgpt/implementation-v1
