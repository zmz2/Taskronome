name: Bootstrap implementation source

on:
  push:
    branches:
      - chatgpt/implementation-v1
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/implementation-v1
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, io, tarfile

          names = ["source.part00", "source.part01a", "source.part01b"]
          names += [f"source.part{i:02d}" for i in range(2, 17)]
          names += ["source.part17a", "source.part17b", "source.part18", "source.part19"]
          expected_sizes = [6000, 3000, 3000] + ([6000] * 15) + [3000, 3000, 6000, 1452]
          expected_hashes = [
              "424d622af0dcb8d87be00c9ee9efb14aee364cd4e717132d28addeedd66cc7c0",
              "85c42fcd9e09e8b02d77ec1e44673fe48e548aa2806f6080c24465f21f065142",
              "9f5da668c02ea52eb70455d2bdfe66823d55767194a1f2fa4895e96bf43c2b6b",
              "dac45530517399cb46f2eaa0fb320fcefce03da35c6210c07eddf61b256eaad5",
              "17fe38723d9c6cc9792b1e96b0c88f12a89d26ee70fc493b7b2f537b8f526813",
              "be6b72d756f6719fcba59a05b54d5b5cc1d0a0918fd5b502b64a4bf2d2e0afbd",
              "3f6a491f58b748996b22679519ce20e66b3c3b3e6af81f553cd60f9daa038eff",
              "8f93b891c9d59fdab10a4cb8f91835c69cd77a76d1e318b4766b17d8f16a0ba4",
              "6e16d877e52431dd80f3ef8c58cb7e58f7e1ca694687a5f444c37954dc4d05b8",
              "62460ba0006f2fbd45f633380368280cb16c619460c21f3f021ae8ddac130c78",
              "2e699941c36e27151b7dce26d2829d14e4a842d2ed84c792ff656fd655ca0e24",
              "0666c9c22ae06911cd8d6375fc3584fe538ce98e0f30d72e233333165ac6f8ed",
              "d17e8fdeb171fa3e9c7afa924960249ed45d9c1f0b11f488716263ed09fb8437",
              "ff793bb09cde042abb3d9a99856e6a3342d94d2433e4c830d899f80d2f855650",
              "8af2afed65eeb972da905ac5972a03e4b532bf7d87ea9d585c7af6420eacefdd",
              "857e9ab154cf3924f2d1e03f257431e766bc58694dce21d8941be10c51d8ebda",
              "561c63a5a709230f29a756220960136ff34edc0a89ba45238a6ce7ae271d5813",
              "a5ed7240be70c8568dcfeaeea5498686241a6db1da05a9fefddcf0bd614d4358",
              "eda0fb59a376955348b137f35e62dd07999586b07a5335c88b90d1c53233da06",
              "df87d327f15235a84171debbac75cb321107a93364905ef4f3f5fbf164b7abf8",
              "85da9913eeeebc9ae423544a6f49871d8dd352cc867fe5fa6a5f853e59cdccb0",
              "07efdc87660da16fbc245793e41016149f8cb89f60d053c990057d6c62bb18be",
          ]
          parts = [Path("bootstrap") / name for name in names]
          mismatches = []

          for path, expected_size, expected_hash in zip(parts, expected_sizes, expected_hashes, strict=True):
              if not path.is_file():
                  mismatches.append(f"missing: {path}")
                  continue
              raw_part = path.read_bytes()
              actual_hash = hashlib.sha256(raw_part).hexdigest()
              if len(raw_part) != expected_size or actual_hash != expected_hash:
                  mismatches.append(
                      f"{path}: size {len(raw_part)}/{expected_size}; sha256 {actual_hash}/{expected_hash}"
                  )

          if mismatches:
              raise SystemExit("payload segment mismatch:\n" + "\n".join(mismatches))

          encoded = "".join(path.read_text(encoding="ascii") for path in parts)
          if len(encoded) != 115452:
              raise SystemExit(f"encoded payload length mismatch: {len(encoded)}")

          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "90f6d1f62c57ce04de52b18a2f6f49fa1692f52e41a389af0471d164a3bde433"
          if digest != expected:
              raise SystemExit(f"SHA-256 mismatch: {digest}")

          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              archive.extractall(".")

          print(f"extracted {len(members)} entries; SHA-256 {digest}")

      - name: Replace bootstrap payload with implementation
        shell: bash
        run: |
          # Workflow files are committed separately through the authenticated GitHub connector.
          # GitHub correctly rejects workflow creation by the restricted Actions token.
          rm -f .github/workflows/ci.yml
          rm -rf bootstrap
          git config user.name "Taskronome bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Taskronome v1.0 source"
          git push origin HEAD:chatgpt/implementation-v1

# Retry 6: commit verified source without modifying workflow files.
