name: Bootstrap implementation source

on:
  push:
    branches:
      - chatgpt/implementation-v1
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/implementation-v1
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, io, tarfile

          names = [f"source.part{i:02d}" for i in range(17)]
          names += ["source.part17a", "source.part17b", "source.part18", "source.part19"]
          expected_sizes = [6000] * 17 + [3000, 3000, 6000, 1452]
          parts = [Path("bootstrap") / name for name in names]

          for path, expected_size in zip(parts, expected_sizes, strict=True):
              if not path.is_file():
                  raise SystemExit(f"missing payload segment: {path}")
              actual_size = len(path.read_text(encoding="ascii"))
              if actual_size != expected_size:
                  raise SystemExit(f"payload segment size mismatch: {path} = {actual_size}, expected {expected_size}")

          encoded = "".join(path.read_text(encoding="ascii") for path in parts)
          if len(encoded) != 115452:
              raise SystemExit(f"encoded payload length mismatch: {len(encoded)}")

          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "90f6d1f62c57ce04de52b18a2f6f49fa1692f52e41a389af0471d164a3bde433"
          if digest != expected:
              raise SystemExit(f"SHA-256 mismatch: {digest}")

          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              archive.extractall(".")

          print(f"extracted {len(members)} entries; SHA-256 {digest}")

      - name: Replace bootstrap payload with implementation
        shell: bash
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "Taskronome bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Taskronome v1.0"
          git push origin HEAD:chatgpt/implementation-v1

# Retry 3: split and size-check segment 17 before mandatory archive hash verification.
